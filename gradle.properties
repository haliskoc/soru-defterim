# =============================================================================
# DÜŞÜK RAM DERLEME YAPILANDIRMASI (8 GB RAM hedefi)
# -----------------------------------------------------------------------------
# Bu değerler bilinçli olarak MÜTEVAZILTIR. 8 GB'lık bir makinede Android Studio
# (2-4 GB) + Gradle Daemon + Kotlin Daemon + AAPT2/D8 + varsa emülatör birlikte
# çalışır. Önceki ayarlarda 1536m + 512m (Gradle) ve 2048m + 512m (Kotlin)
# = ~4.5 GB TAVAN vardı; bu, 8 GB makinede sistemin swap'e düşmesine ve
# "bilgisayar donuyor / giremiyorum" tablosuna yol açıyordu.
#
# Şimdi: Gradle ~1.6 GB + Kotlin ~1.6 GB = ~3.2 GB tavan.
# =============================================================================

# Gradle Daemon: derleme sırasında gerçekten gereken maximum heap.
# -XX:+UseSerialGC: çok çekirdekli makinada her bir GC işçisi ayrı bellek harcar.
# 8 GB'de SerialGC hem daha az yer yer hem daha öngörülebilir duraklamalar verir.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# Kotlin Daemon: KSP + Compose derlemesi burada çalışır. Gradle ile AYRI bir JVM'de
# tutulur; in-process stratejisi tek JVM'ye indirirdi ama 1024m tek başına
# yetersiz kalıp OOM riskini artırıyordu.
#
# NOT (Metaspace): 320m YETERSİZDİ. R8 (minifyReleaseWithR8) + D8 + ProGuard çok
# sayıda sınıf yüklediği için daemon Metaspace'i tüketip saatlerce "takılı"
# görünüyor ve makine donuyordu. 512m güvenli alt sınırdır. Release derlemesi
# daha fazlasını ister; ./derle.sh release bu değeri geçici olarak 768m'ye çıkarır.
# 1024m ile bu proje (KSP + Compose + Hilt) sınırdaydı: bir derlemede Kotlin
# daemon'ı "Backend Internal error: Exception during IR lowering" ile OOM
# düşüyordu. 1440m'ye çıkarıldı; en kötü durumda toplam tavan ~3.4 GB ve
# ölçülen tepe kullanım 5.9 GB olduğu için 8 GB'da güvenli.
kotlin.daemon.jvmargs=-Xmx1440m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC

# MUTLAK ÇOK PARALELLİK KAPAT: aynı anda birden fazla derleyici/worker JVM'si
# açılmasın. 8 GB'ın ana kasma sebebi budur.
org.gradle.workers.max=1
org.gradle.parallel=false

# Artımlı derleme + yerel derleme önbelleği: ikinci ve sonraki derlemeleri
# belirgin şekilde hızlandırır, tekrarlanan tam derleme yapılmasını önler.
kotlin.incremental=true
org.gradle.caching=true

# Daemon'ı YENİDEN KULLAN (her derlemede 2-3 dk başlatma kaybı olmasın) ama
# boşta kaldığında belleğini BIRAK (arka planda yazdığın yazılarda RAM tüketmesin).
org.gradle.daemon=true
org.gradle.daemon.idletimeout=1800000

org.gradle.java.home=/home/lenovo/.jdks/jdk-17.0.12+7
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
ksp.incremental=false
ksp.incremental.intermodule=false
